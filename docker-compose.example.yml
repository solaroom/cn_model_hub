# docker-compose.yml - Example configuration for cn_model_hub
# Copy this to docker-compose.yml and customize for your deployment

services:
  hub-ui:
    image: nginx:alpine
    container_name: hub-ui
    restart: always
    ports:
      - "28080:80" # Public web interface
    volumes:
      - ./src/cn-model-hub-ui/dist:/usr/share/nginx/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - hub-api

  hub-api:
    build: .
    container_name: hub-api
    restart: always
    ports:
      - "48888:48888" # Internal API port (optional, for debugging)
    depends_on:
      - postgres
      - lakefs
      - minio
      - valkey
    environment:
      ## ===== CRITICAL: Endpoint Configuration (MUST CHANGE) =====
      ## These determine how users access your cn_model_hub instance
      - CN_MODEL_HUB_BASE_URL=http://127.0.0.1:28080 # Change to your public URL (e.g., https://hub.example.com)
      - CN_MODEL_HUB_S3_PUBLIC_ENDPOINT=http://127.0.0.1:29001 # Change to your S3 public URL

      ## ===== CRITICAL: Security Configuration (MUST CHANGE) =====
      - CN_MODEL_HUB_SESSION_SECRET=change-this-to-random-string-in-production
      - CN_MODEL_HUB_DATABASE_KEY=change-this-to-random-encryption-key-in-production # For external tokens (generate with: openssl rand -hex 32)

      ## ===== Performance Configuration =====  
      - CN_MODEL_HUB_WORKERS=4 # Number of worker processes (1-8, recommend: CPU cores)

      ## ===== Database Configuration =====
      - CN_MODEL_HUB_DB_BACKEND=postgres
      - CN_MODEL_HUB_DATABASE_URL=postgresql://<user>:<password>@postgres:5432/cn_model_hub
      - CN_MODEL_HUB_AUTO_MIGRATE=true # Auto-confirm database migrations (required for Docker)

      ## ===== S3 Storage Configuration =====
      - CN_MODEL_HUB_S3_ENDPOINT=http://minio:9000
      - CN_MODEL_HUB_S3_ACCESS_KEY=minioadmin
      - CN_MODEL_HUB_S3_SECRET_KEY=minioadmin
      - CN_MODEL_HUB_S3_BUCKET=hub-storage
      - CN_MODEL_HUB_S3_REGION=us-east-1  # S3 region (us-east-1 for MinIO, auto for R2, or specific AWS region)
      # - CN_MODEL_HUB_S3_SIGNATURE_VERSION=s3v4  # Uncomment for R2/AWS S3 (leave commented for MinIO default)

      ## ===== LakeFS Configuration =====
      - CN_MODEL_HUB_LAKEFS_ENDPOINT=http://lakefs:28000
      - CN_MODEL_HUB_LAKEFS_REPO_NAMESPACE=hf
      # LakeFS credentials auto-generated on first start

      ## ===== Application Configuration =====
      - CN_MODEL_HUB_SITE_NAME=cn_model_hub
      - CN_MODEL_HUB_LFS_THRESHOLD_BYTES=1000000
      - CN_MODEL_HUB_LFS_MULTIPART_THRESHOLD_BYTES=2_000_000_000 # 2GB - keep common demo models on single PUT
      - CN_MODEL_HUB_LFS_MULTIPART_CHUNK_SIZE_BYTES=50_000_000 # 50MB - size of each part (min 5MB except last)
      - CN_MODEL_HUB_LFS_KEEP_VERSIONS=5
      - CN_MODEL_HUB_LFS_AUTO_GC=true

      ## ===== Auth & SMTP Configuration =====
      - CN_MODEL_HUB_REQUIRE_EMAIL_VERIFICATION=false
      - CN_MODEL_HUB_INVITATION_ONLY=false # Set to true to require invitation for registration
      - CN_MODEL_HUB_SESSION_EXPIRE_HOURS=168
      - CN_MODEL_HUB_TOKEN_EXPIRE_DAYS=365
      # SMTP (Optional - for email verification)
      - CN_MODEL_HUB_SMTP_ENABLED=false
      - CN_MODEL_HUB_SMTP_HOST=smtp.gmail.com
      - CN_MODEL_HUB_SMTP_PORT=587
      - CN_MODEL_HUB_SMTP_USERNAME=
      - CN_MODEL_HUB_SMTP_PASSWORD=
      - CN_MODEL_HUB_SMTP_FROM=noreply@cn_model_hub.local
      - CN_MODEL_HUB_SMTP_TLS=true

      ## ===== Storage Quota Configuration (Optional) =====
      - CN_MODEL_HUB_DEFAULT_USER_PRIVATE_QUOTA_BYTES=30_000_000_000
      - CN_MODEL_HUB_DEFAULT_USER_PUBLIC_QUOTA_BYTES=30_000_000_000
      - CN_MODEL_HUB_DEFAULT_ORG_PRIVATE_QUOTA_BYTES=30_000_000_000
      - CN_MODEL_HUB_DEFAULT_ORG_PUBLIC_QUOTA_BYTES=30_000_000_000

      ## ===== Fallback Configuration (Optional) =====
      # - CN_MODEL_HUB_FALLBACK_ENABLED=true
      # - CN_MODEL_HUB_FALLBACK_REQUIRE_AUTH=false # Set true to require authentication for fallback access
      # - CN_MODEL_HUB_FALLBACK_SOURCES=[{"url":"https://huggingface.co","name":"HuggingFace","source_type":"huggingface","priority":1}]

      ## ===== L2 Cache (Valkey) =====
      # See docs/development/cache.md for the design (multi-tier, write-through
      # invalidation, boot-time flush of mutable namespaces).
      - CN_MODEL_HUB_CACHE_ENABLED=true
      - CN_MODEL_HUB_CACHE_URL=redis://valkey:6379/0
      # - CN_MODEL_HUB_CACHE_NAMESPACE=kh # Override if multiple deployments share Valkey
    volumes:
      - ./hub-meta/hub-api:/hub-api-creds

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    command: server /data --console-address ":29000"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      # Required so the SPA can do cross-origin Range reads on presigned
      # /resolve/ targets for the pure-client safetensors/parquet preview
      # (deepghs/cn_model_hub#27). Tighten to a specific origin list in prod.
      - MINIO_API_CORS_ALLOW_ORIGIN=*
    ports:
      - "29001:9000"    # S3 API
      - "29000:29000"   # Web Console
    volumes:
      - ./hub-storage/minio-data:/data
      - ./hub-meta/minio-data:/root/.minio

  lakefs:
    build:
      context: ./docker/lakefs
    container_name: lakefs
    environment:
      - LAKEFS_DATABASE_TYPE=local
      - LAKEFS_DATABASE_LOCAL_PATH=/var/lakefs/data/metadata.db
      - LAKEFS_BLOCKSTORE_TYPE=s3
      - LAKEFS_BLOCKSTORE_S3_ENDPOINT=http://minio:9000
      - LAKEFS_BLOCKSTORE_S3_BUCKET=hub-storage
      - LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE=true
      - LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID=minioadmin
      - LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY=minioadmin
      - LAKEFS_BLOCKSTORE_S3_REGION=us-east-1  # S3 region (us-east-1 for MinIO, auto for R2, or specific AWS region)
      - LAKEFS_AUTH_ENCRYPT_SECRET_KEY=change-me-in-production
      - LAKEFS_LOGGING_FORMAT=text
      - LAKEFS_LISTEN_ADDRESS=0.0.0.0:28000
    ports:
      - "28000:28000"   # LakeFS admin UI (optional)
    user: "${UID}:${GID}"
    depends_on:
      - minio
    volumes:
      - ./hub-meta/lakefs-data:/var/lakefs/data
      - ./hub-meta/lakefs-cache:/lakefs/data/cache

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=<user>
      - POSTGRES_PASSWORD=<password>
      - POSTGRES_DB=cn_model_hub
    ports:
      - "25432:5432" # Optional: for external access
    volumes:
      - ./hub-meta/postgres-data:/var/lib/postgresql/data

  # L2 cache. Pure cache: losing it never compromises correctness. The
  # volume + RDB persistence is intentional — it preserves the warm Mode-A
  # working set (LakeFS commit_id-keyed entries) across restarts so that
  # Valkey upgrades / patches don't generate a synchronized LakeFS REST
  # spike. Mode-B (mutable) namespaces are flushed on every Valkey restart
  # by the API's bootstrap coordinator, regardless of RDB contents — see
  # MODE_B_PREFIXES in src/cn_model_hub/cache.py.
  valkey:
    image: valkey/valkey:8-alpine
    container_name: valkey
    restart: always
    # Internal-only by default. Add a `ports:` entry only if you need
    # to attach valkey-cli from the host for debugging.
    command: >-
      valkey-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lfu
      --save 300 100
      --appendonly no
    user: "${UID}:${GID}"
    volumes:
      # Same hub-meta convention as the other stateful services so all
      # local persistence is rooted under one tree. Cache contents are
      # recoverable from L3 — the directory is here for warm-restart
      # benefits, not for backup.
      - ./hub-meta/valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  default:
    name: hub-net
